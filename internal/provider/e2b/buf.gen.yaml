version: v2
inputs:
  - directory: spec/envd
plugins:
  - local: protoc-gen-go
    out: envdpb
    opt:
      - paths=source_relative
      - Mprocess/process.proto=github.com/bugnet-sh/bugnet-router/internal/provider/e2b/envdpb/process
      - Mfilesystem/filesystem.proto=github.com/bugnet-sh/bugnet-router/internal/provider/e2b/envdpb/filesystem
  - local: protoc-gen-connect-go
    out: envdpb
    opt:
      - paths=source_relative
      - Mprocess/process.proto=github.com/bugnet-sh/bugnet-router/internal/provider/e2b/envdpb/process
      - Mfilesystem/filesystem.proto=github.com/bugnet-sh/bugnet-router/internal/provider/e2b/envdpb/filesystem
