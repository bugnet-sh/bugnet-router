global
    log /dev/log local0
    user haproxy
    group haproxy
    maxconn 20000
    hard-stop-after 2h

defaults
    mode tcp
    log global
    timeout connect 5s
    timeout client 24h
    timeout server 24h

# These backends hold only per-source counters
backend st_tls
    stick-table type ipv6 size 200k expire 10m store conn_cur,conn_rate(10s)
backend st_web
    stick-table type ipv6 size 200k expire 10m store conn_cur,conn_rate(10s)
backend st_ssh
    stick-table type ipv6 size 100k expire 10m store conn_cur,conn_rate(60s)

frontend tls
    bind :443
    bind :::443 v6only
    maxconn 14000
    acl hello req.ssl_hello_type 1
    acl web var(sess.be) -m str edge secrets sessions website edge_dev secrets_dev sessions_dev
    tcp-request connection track-sc0 src table st_tls
    tcp-request connection reject if { sc0_conn_cur(st_tls) gt 2000 }
    tcp-request connection reject if { sc0_conn_rate(st_tls) gt 1000 }
    tcp-request inspect-delay 5s
    # the suffix first, then an exact name overrides it; a lookup that misses sets nothing
    tcp-request content set-var(sess.be) req.ssl_sni,lower,map_end(/etc/haproxy/end.map) if hello
    tcp-request content set-var(sess.be) req.ssl_sni,lower,map_str(/etc/haproxy/sni.map) if hello
    tcp-request content track-sc1 src table st_web if web
    tcp-request content reject if web { sc1_conn_cur(st_web) gt 256 }
    tcp-request content reject if web { sc1_conn_rate(st_web) gt 300 }
    tcp-request content accept if hello
    use_backend %[var(sess.be)] if { var(sess.be) -m found }
    default_backend egress

frontend ssh
    bind :22
    bind :::22 v6only
    maxconn 4000
    tcp-request connection track-sc0 src table st_ssh
    tcp-request connection reject if { sc0_conn_cur(st_ssh) gt 32 }
    tcp-request connection reject if { sc0_conn_rate(st_ssh) gt 60 }
    default_backend ssh

frontend ssh_dev
    bind :2200
    maxconn 500
    tcp-request connection track-sc0 src table st_ssh
    tcp-request connection reject if { sc0_conn_cur(st_ssh) gt 32 }
    default_backend ssh_dev

backend edge
    server edge 127.0.0.1:8443 send-proxy-v2
backend secrets
    server secrets 127.0.0.1:8445 send-proxy-v2
backend sessions
    server sessions 127.0.0.1:8448 send-proxy-v2
backend egress
    server egress 127.0.0.1:9443 send-proxy-v2
backend ssh
    server ssh 127.0.0.1:2223 send-proxy-v2
backend mcp
    server mcp 127.0.0.1:8444 send-proxy-v2
backend website
    server website 127.0.0.1:8446 send-proxy-v2
backend edge_dev
    server mac 127.0.0.1:18443 send-proxy-v2
backend secrets_dev
    server mac 127.0.0.1:18445 send-proxy-v2
backend sessions_dev
    server mac 127.0.0.1:18448 send-proxy-v2
backend egress_dev
    server mac 127.0.0.1:19443 send-proxy-v2
backend ssh_dev
    server mac 127.0.0.1:12223 send-proxy-v2
