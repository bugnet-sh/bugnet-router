# /etc/bugnet/valkey.conf, included last from the distro's valkey.conf (or redis.conf) by deploy.sh
# A Unix socket only, its group valkey, whose one other member is bugnet-router (DP 15.3)
port 0
unixsocket /run/valkey/valkey.sock
unixsocketperm 770
# Nothing may be evicted, so a full Valkey refuses writes (bugnet-router README, Deployment).
# 1 GiB holds the streams of about 25 placements at once; raise it with the VPS's memory
maxmemory 512mb
maxmemory-policy noeviction
