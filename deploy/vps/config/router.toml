[images.lium]                 # from deploy/image/builds/prod-2026.11.3.json, as images.e2b
version = "2026.11.3"
ref = "ghcr.io/bugnet-sh/bugnet-base@sha256:2a471ceb0c0ca15563b40dd4421f27f81815765e5d5c4e44619da96ad176fb19"
os = "ubuntu-24.04"
[images.lium.tools]
curl = "8.5"
docker = "none"
gcc = "13.3"
git = "2.43"
hf = "2.4"
make = "4.3"
nft = "1.0"
node = "24.22"
pnpm = "12.18"
python3 = "3.12"
sshd = "9.6"
tar = "1.35"
uv = "0.13"

[hf]
# "baked" runs the image's own sbx-server, which needs images.hf.version 2026.11.4 or later
sbx_server = "fetch"          # downloaded at boot from HF's public bucket, checked by its sha256

[boat.types]                  # never xlarge, Boat sells it only on its $100 a month plan
small = "small"
default = "default"
large = "large"

[[e2b.templates]]
