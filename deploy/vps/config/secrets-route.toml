# bugnet-edge --role secrets on the production VPS, /etc/bugnet/secrets-route.toml (DP 8.4)
# Its one secret comes only from /etc/bugnet/secrets-route.env: BUGNET_SECRETS_TOKEN

router_url = "http://127.0.0.1:8080"
tls_listen_addr = "127.0.0.1:8445"
metrics_listen_addr = "127.0.0.1:9104"
proxy_protocol_from = ["127.0.0.1/32", "::1/128"]
host = "secrets.bugnet.sh"
page_dir = "/srv/bugnet/secrets-page"   # the gateway team's entry page bundle (DP 17)
acme_enabled = true
acme_directory = "https://acme-v02.api.letsencrypt.org/directory"
acme_dir = "/var/lib/bugnet-secrets/acme"
acme_email = ""
