# pg_hba.conf, the whole file (DP 15.3). Peer logins on the Unix socket only: each Unix user
# reaches its own role and database, and a login that matches no line is refused
# TYPE  DATABASE          USER              METHOD
local   all               postgres          peer
local   bugnet            bugnet_router     peer map=bugnet
local   bugnet_payments   bugnet_payments   peer map=bugnet
