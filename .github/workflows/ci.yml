name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

# Runs on main and feat/router-v1-rest all finish, elsewhere a newer run cancels the older one
concurrency:
  group: >-
    ${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' ||
    github.ref == 'refs/heads/feat/router-v1-rest') && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: bugnet-router

    # internal/testenv gives unit tests a fresh Postgres database and Valkey prefix
    services:
      postgres:
        # Ubuntu 26.04's postgresql, which deploy/vps/deploy.sh installs, is 18
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      valkey:
        # Ubuntu 26.04's valkey-server is 9.0
        image: valkey/valkey:9.0
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      BUGNET_TEST_PG_URL: postgres://postgres@localhost:5432/postgres?sslmode=disable
      BUGNET_TEST_VALKEY_ADDR: localhost:6379

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: bugnet-router
          persist-credentials: false

      # Siblings use the branch of the same name, else the pull request's base, else main
      - name: Pick sibling branches
        id: siblings
        env:
          HEAD: ${{ github.head_ref || github.ref_name }}
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          pick() {
            local ref status
            for ref in "$HEAD" "$BASE" main; do
              [ -n "$ref" ] || continue
              status=0
              git ls-remote --exit-code --heads "https://github.com/bugnet-sh/$1.git" \
                "refs/heads/$ref" > /dev/null || status=$?
              if [ "$status" -eq 0 ]; then
                echo "$ref"
                return 0
              elif [ "$status" -ne 2 ]; then
                return "$status"
              fi
            done
            echo "no branch of $1 to check out" >&2
            return 1
          }
          proto=$(pick bugnet-proto)
          run=$(pick bugnet-run)
          echo "bugnet-proto at $proto, bugnet-run at $run"
          echo "proto=$proto" >> "$GITHUB_OUTPUT"
          echo "run=$run" >> "$GITHUB_OUTPUT"

      # go.mod replaces bugnet-proto and bugnet-run with ../bugnet-proto and ../bugnet-run
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bugnet-sh/bugnet-proto
          ref: ${{ steps.siblings.outputs.proto }}
          path: bugnet-proto
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bugnet-sh/bugnet-run
          ref: ${{ steps.siblings.outputs.run }}
          path: bugnet-run
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: bugnet-router/go.mod
          cache-dependency-path: bugnet-router/go.sum

      - name: gofmt
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt -w needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: bugnet-router

      # Temporary: repeats the tests this branch made deterministic
      - name: Repeat the changed tests
        run: |
          set -euo pipefail
          {
            go test -count=20 -run '^TestDownloadResumeChecksTheFile$' ./internal/api/
            go test -count=20 -run '^TestOutboxRetriesOnFailure$' ./internal/worker/
          } 2>&1 | tee "$RUNNER_TEMP/go-test.log"

      # Live provider, stack and x402local tests skip without their keys and BUGNET_TEST_* flags
      - name: go test
        run: |
          set -euo pipefail
          go test -short -timeout 20m ./... 2>&1 | tee "$RUNNER_TEMP/go-test.log"

      # Gives each failing test, panic or build its own annotation, on the run page and the PR
      - name: Report failed tests
        if: failure()
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/go-test.log"
          [ -f "$log" ] || exit 0
          # An annotation shows at most 4096 characters, so each block stops near 3800
          awk '
            function add(s) {
              if (cut[nb]) return
              if (length(body[nb]) + length(s) > 3800) {
                cut[nb] = 1
                body[nb] = body[nb] "(cut, the step summary has the rest)\n"
                return
              }
              body[nb] = body[nb] s "\n"
            }
            function emit(title, text) {
              sub(/^github\.com\/bugnet-sh\//, "", title)
              gsub(/%/, "%25", title); gsub(/:/, "%3A", title); gsub(/,/, "%2C", title)
              gsub(/%/, "%25", text); gsub(/\r/, "%0D", text); gsub(/\n/, "%0A", text)
              print "::error title=FAIL " title "::" text
            }
            /^(ok|\?) / { nb = 0; body[0] = ""; cut[0] = 0; mode = ""; next }
            /^FAIL$/ { next }
            /^# / { mode = "build"; bpkg = $2; next }
            /^--- FAIL: / || /^panic: test timed out/ || (/^panic: / && nb == 0) {
              mode = "test"; nb++; name[nb] = /^---/ ? $3 : "panic"; body[nb] = ""; cut[nb] = 0
            }
            /^FAIL\t/ {
              pkg = $2
              if (pkg in build) emit(pkg " build", build[pkg])
              else if (nb == 0) emit(pkg, body[0] $0)
              for (i = 1; i <= nb; i++) emit(pkg " " name[i], body[i])
              delete build[pkg]; nb = 0; body[0] = ""; cut[0] = 0; mode = ""
              next
            }
            mode == "build" {
              if (length(build[bpkg]) < 3800) build[bpkg] = build[bpkg] $0 "\n"
              next
            }
            { add($0) }
          ' "$log" > "$RUNNER_TEMP/annotations"
          # A step shows at most 10 error annotations
          n=$(wc -l < "$RUNNER_TEMP/annotations")
          if [ "$n" -gt 10 ]; then
            head -n 9 "$RUNNER_TEMP/annotations"
            echo "::error title=More failures::$((n - 9)) more, listed in the step summary"
          else
            cat "$RUNNER_TEMP/annotations"
          fi
          {
            echo '```text'
            grep -v -E '^(ok|\?) ' "$log" | head -c 900000 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
