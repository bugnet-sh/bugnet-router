version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - revive
    - lll
  settings:
    lll:
      line-length: 100
      tab-width: 4
  exclusions:
    paths:
      - internal/provider/boxd/boxdpb
      - internal/provider/e2b/api
      - internal/provider/e2b/envdpb
    rules:
      - path: internal/provider/boxd/
        linters:
          - revive
        text: "var-naming: method \\w*Vm\\w* should be"

formatters:
  enable:
    - gofmt
