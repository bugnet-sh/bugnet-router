# Settings scripts/dev-up.sh runs with, on the local provider only. dev-up.sh adds
# order_token_public_key in front and writes the result to bin/dev.toml. Secrets live in .env and
# .env.keys, never here. Paths are relative to the repository root, where dev-up.sh runs, and
# config/example.toml lists every setting.

packages_file = "config/dev-packages.json"
providers = ["local"]         # cheapest first, so a real provider replaces local, its key in .env
deployment_id = "dev"         # its sweep never destroys main's sandboxes on a shared account

[api]
listen_addr = "127.0.0.1:8080"
reuse_port = false

[worker]
listen_addr = "127.0.0.1:8081"

[valkey]
prefix = "bn:dev:"

[runner]
linux_amd64 = "../bugnet-run/dist/bugnet-run-linux-amd64"   # make build in bugnet-run writes it

[names]                       # the live-test set, which the VPS fronts beside production
preview_domain = "preview.dev.bugnet.sh"
transfer_host = "transfer.dev.bugnet.sh"
secrets_host = "secrets.dev.bugnet.sh"
ssh_host = "ssh.dev.bugnet.sh"
ssh_port = 2200               # port 22 cannot be split by name, so dev SSH has its own
egress_host = "egress.dev.bugnet.sh"

[sessions]
base_url = "https://sessions.dev.bugnet.sh"

[secrets.source_check]
modes = {}                    # local reports no egress address, a listed Boat takes boat = "report"

[x402]
enabled = false               # the kill switch, off here until the x402 switch-on

[wallets]                     # the payer path on, so bugnet-dev create --payer exercises it
use_payer = true              # dev-up.sh's .env.keys holds BUGNET_PAYMENTS_ROUTER_TOKEN
emit_events = true
anonymous_max_concurrent = 1000   # most dev tokens carry no payer
facilitator_addresses = ["DevFaci1itatorAddress1111111111111111111111"]

[stats]
listen_addr = ""              # off, so a second dev router never fights for 8082

[hardening]
pool_list = "config/dev-mining-pools.txt"   # a stand-in, so /monitor shows no pool list line

[local]
enabled = true                # runs commands on this machine, never give it untrusted code
root = "bin/local"
runner = "bin/bugnet-run"

[[e2b.templates]]
size = "2x2"
template = "bugnet-2x2"
vcpu = 2
memory_mib = 2048
disk_gib = 10

[[e2b.templates]]
size = "4x8"
template = "bugnet-4x8"
vcpu = 4
memory_mib = 8192
disk_gib = 10
