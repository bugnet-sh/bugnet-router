# Settings scripts/dev-up.sh runs with, on the local provider only. dev-up.sh adds
# order_token_public_key in front and writes the result to bin/dev.toml. Secrets live in .env and
# .env.keys, never here. Paths are relative to the repository root, where dev-up.sh runs, and
# config/example.toml lists every setting.

packages_file = "config/dev-packages.json"
providers = ["local"]         # cheapest first, so a real provider replaces local, its key in .env
gpu_order = ["lium", "hf"]    # a GPU package tries these first, once providers lists them
gpu_placing_budget = "13m"    # at least lium's slowest failing boot, so hf still gets its turn
deployment_id = "dev"         # its sweep never destroys main's sandboxes on a shared account

[api]
listen_addr = "127.0.0.1:8080"
reuse_port = false

[worker]
listen_addr = "127.0.0.1:8081"

[valkey]
prefix = "bn:dev:"

[runner]
linux_amd64 = "../bugnet-run/dist/bugnet-run-linux-amd64"   # make build in bugnet-run writes it

[images]                      # no build yet, so accept stays empty
channel = "dev"

[names]                       # the live-test set, which the VPS fronts beside production
preview_domain = "preview.dev.bugnet.sh"
transfer_host = "transfer.dev.bugnet.sh"
secrets_host = "secrets.dev.bugnet.sh"
ssh_host = "ssh.dev.bugnet.sh"
ssh_port = 2200               # port 22 cannot be split by name, so dev SSH has its own
egress_host = "egress.dev.bugnet.sh"
hooks_host = "hooks.dev.bugnet.sh"

[sessions]
base_url = "https://sessions.dev.bugnet.sh"

[secrets.source_check]
modes = {}                    # local reports no egress address, a listed Boat takes boat = "report"

[x402]
enabled = false               # the kill switch, off here until the x402 switch-on

[wallets]                     # the payer path on, so bugnet-dev create --payer exercises it
use_payer = true              # dev-up.sh's .env.keys holds BUGNET_PAYMENTS_ROUTER_TOKEN
emit_events = true
anonymous_max_concurrent = 1000   # most dev tokens carry no payer
facilitator_addresses = ["DevFaci1itatorAddress1111111111111111111111"]

[stats]
listen_addr = ""              # off, so a second dev router never fights for 8082

[hardening]
pool_list = "config/dev-mining-pools.txt"   # a stand-in, so /monitor shows no pool list line

[local]
enabled = true                # runs commands on this machine, never give it untrusted code
root = "bin/local"
runner = "bin/bugnet-run"

[[pools.pool]]                # the local provider's one size, so the dev stack has a warm member
provider = "local"
size = "local"
min = 1
max = 2

[reserve]                     # the dev stack's local provider may start a sandbox before payment
speculative_providers = ["local"]
hold = "60s"
max_hold = "120s"

[lium]                        # the dev key's bounds, 2 pods at the $0.35 cap for a day is $16.80
max_concurrent = 2
key_daily_budget_micros = 20000000   # the bugnet-dev key's daily budget at Lium, $20

[[lium.sizes]]                # the dev packages' size alone
size = "lium-rtx3090"
model = "NVIDIA RTX 3090"
match = ["NVIDIA GeForce RTX 3090"]
gpus = 1
gpu_memory_gib = 24
vcpu = 8
memory_mib = 28672
disk_gib = 200
max_hourly_micros = 350000

[hf]
namespace = ""                # the founder's dev organization, set once it exists
flavors = []                  # flavors sold, every GPU flavor when empty
max_lifetime = "2h"
extend_room = "60m"           # extension room in each Job's timeout
timeout_margin = "10m"
ready_timeout = "5m"          # create to RUNNING and sbx-server health
start_billed = "3m"           # Starting, boot steps and minute rounding
poll_every = "3s"             # Job reads while waiting for RUNNING
sbx_server = "fetch"          # "baked" once the image holds it
sbx_server_version = "0.7.0"
sbx_server_sha256 = "eb2b04f79fbe765195300aaf1582be2a2a9ea698ff067d0cab428171d5584932"
harden_required = false       # true means hf never serves, since harden cannot run there
harden_allow = []
token_plan = "free"           # the token user's Hub plan, "free" or "pro"
ops_per_second = 3            # Jobs API calls, at most 3 on "free", 8 on "pro", no user bucket
max_concurrent = 10
creates_per_second = 1

[[e2b.templates]]
size = "2x2"
template = "bugnet-2x2"
vcpu = 2
memory_mib = 2048
disk_gib = 10

[[e2b.templates]]
size = "4x8"
template = "bugnet-4x8"
vcpu = 4
memory_mib = 8192
disk_gib = 10

[telemetry]
traces = false
otlp_endpoint = ""                     # the trace backend's OTLP/HTTP URL, which row TRACE3 exports to
environment = "dev"
