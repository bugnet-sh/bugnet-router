[hf]                          # Hugging Face Jobs, placed only while providers lists hf
namespace = ""                # the organization the Jobs run and bill under, required with hf
flavors = []                  # flavors sold, every GPU flavor when empty
max_lifetime = "2h"
extend_room = "60m"           # extension room in each Job's timeout
timeout_margin = "10m"
ready_timeout = "5m"          # create to RUNNING and sbx-server health
start_billed = "3m"           # Starting, boot steps and minute rounding
poll_every = "3s"             # Job reads while waiting for RUNNING
sbx_server = "fetch"          # "baked" once the image holds it
sbx_server_version = "0.7.0"
sbx_server_sha256 = "eb2b04f79fbe765195300aaf1582be2a2a9ea698ff067d0cab428171d5584932"
harden_required = false       # true means hf never serves, since harden cannot run there
harden_allow = []
token_plan = "free"           # the token user's Hub plan, "free" or "pro"
ops_per_second = 3            # at most 3 on "free", 8 on "pro"
max_concurrent = 10           # HF documents no cap
creates_per_second = 1

[boxd]
region = "fra"                # served at <region>.boxd.sh:9443 outside fra
endpoint = ""                 # overrides the region's endpoint
gate_route = "default"        # the pinned default proxy, or "subdomain" for a bn proxy to the gate
parked_gib = 5                # disk written per hibernated pool member, which sets its idle cost
harden_required = true        # a failed harden fails the boot over to the next provider
harden_allow = []             # the provider's own control addresses, open before any block
ops_per_second = 0            # user operations on the account a second, 0 for no bucket
max_concurrent = 0            # the most sandboxes to place, 0 takes the account's cap
creates_per_second = 0        # creates a second on the account, 0 for no bucket
ready_timeout = "60s"

[e2b]
domain = ""                   # e2b.app when empty
max_lifetime = ""             # Go duration, empty = adapter default (1h Hobby), "24h" on Pro
harden_required = true
harden_allow = []
ops_per_second = 0
team_id = ""                  # printed by bugnet-dev hooks register e2b, the account check reads it
max_concurrent = 20           # not readable with an API key, 20 on Hobby and 100 on Pro
creates_per_second = 1        # 1 on Hobby and 5 on Pro
ready_timeout = "60s"

# No templates by default, and E2B is never chosen without one. These two tables are the builds
# deploy/e2b makes, one per size, keep them once they are built on the E2B account.
[[e2b.templates]]
size = "2x2"                  # size name the router sells
template = "bugnet-2x2"       # template name or ID on the E2B account
vcpu = 2                      # vCPUs the template was built with
memory_mib = 2048             # memory the template was built with
disk_gib = 10                 # disk the plan grants, 10 on Hobby and 20 on Pro

[[e2b.templates]]
size = "4x8"
template = "bugnet-4x8"
vcpu = 4
memory_mib = 8192
disk_gib = 10

[koyeb]
region = "fra"                # region every Koyeb sandbox runs in
harden_required = true
harden_allow = []
ops_per_second = 0
organization_id = ""          # read from the account when empty
max_concurrent = 0            # the most sandboxes to place, 0 takes the account's cap
creates_per_second = 0        # creates a second on the account, 0 for no bucket
pool_idle_hourly_micros = 0   # one unclaimed Light Sleep member an hour, free while it is a preview
ready_timeout = "60s"

[koyeb.instance_types]        # size = instance type, every fra type when empty

[boat]
ssh_path = "gate"             # or "native", only if the gate path fails on Boat
egress_families = ["ipv6", "ipv4"]   # families of Boat's ip taken as the egress source
egress_ipv6_bits = 128        # prefix width of an IPv6 source, 64 to 128, 128 kept
harden_required = true
harden_allow = []
ops_per_second = 50           # 3,000 a minute, inside Boat's 10,000 per 60 s per IP with previews
max_concurrent = 0            # the most sandboxes to place, 0 takes the account's cap
creates_per_second = 0        # creates a second on the account, 0 for no bucket
ready_timeout = "60s"

[boat.types]                  # size = machine type, every type when empty
